name: options_directional
asset_class: options
broker: alpaca_paper_stocks
universe:
  source: russell_1000_momentum
  # 2026-07-02 Brock override: expanded from 15 → 55 symbols. Options
  # directional needs high-momentum names with active weekly options.
  # Added:
  #   - remaining MAG-7 gaps + tier-2 tech growth (PLTR/SNOW/DDOG/NET/PANW etc)
  #   - AI infrastructure winners (MU/ANET/DELL/HPE)
  #   - EV + auto (TSLA already, added RIVN/LCID)
  #   - crypto proxies (COIN/MSTR/HOOD/RIOT/MARA/CLSK)
  #   - consumer momentum (LULU/DECK/CROX/ONON)
  #   - biotech that trends (LLY/NVO)
  #   - premium growth (SHOP/MELI/PDD/BABA)
  symbols:
    # Broad-market ETFs
    - SPY
    - QQQ
    - SMH
    - IBIT
    # Mega-cap tech
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - META
    - AMZN
    - MSFT
    - GOOGL
    - NFLX
    - SMCI
    - AVGO
    - ARM
    - CRM
    - MU
    - ANET
    - DELL
    - HPE
    # Tier-2 growth
    - PLTR
    - SNOW
    - DDOG
    - NET
    - CRWD
    - PANW
    - ZS
    - SHOP
    - ORCL
    - ADBE
    # Consumer momentum
    - LULU
    - DECK
    - CROX
    - ONON
    - COST
    - WMT
    # EV / auto
    - RIVN
    - LCID
    # Crypto proxies
    - COIN
    - MSTR
    - HOOD
    - RIOT
    - MARA
    - CLSK
    # Biotech
    - LLY
    - NVO
    # Premium int'l growth
    - MELI
    - PDD
    - BABA
    - JD
    - TSM
    - ASML
    # Fintech / other momentum
    - SQ
    - PYPL
    - UBER
    - ABNB
  filters:
    - price_gte: 20
    - adv_gte: 5000000
scan_lookback_period: "1y"
cadence: "0,30 10-15 * * 1-5"
watchlist:
  rebuild_at: "30 9 * * 1-5"
  size: 20
  top_n_for_signals: 8
  scoring:
    momentum_30d: 0.4
    technical_setup: 0.35
    catalyst_proximity: 0.25
strategies:
  - bull_put_credit_spread
  - bear_call_credit_spread
  - bull_call_debit_spread
  - leaps_stock_replacement
  - long_call_directional
  # 2026-07-09 SSRN batch 5 — Gao-Xing-Zhang 2018 SSRN 2204549.
  # Long ATM straddle 3 trading days pre-earnings, close T+1 after.
  # Fires event-driven; skipped for symbols without a scheduled earnings
  # date in the window. Mleg long_straddle intent — 2-leg debit, both buys.
  - earnings_straddle
ensemble: weighted_vote
# Same Phase 1 discipline-gate compensation as options_income — these
# strategies don't emit the new factor fields in their reason JSON so
# their composite score lands ~57 against the default 60 threshold.
#
# 2026-06-30: Lowered from 50 → 45 alongside options_income for same
# reason (12+ days silent, paired with PR #42 OCC fix). Daily audit
# will catch over-deployment.
# 2026-07-01 (Brock override): more aggressive, less cash per position.
# Same rationale as options_income — see that YAML for details. LEAPS at
# ~$36/share × 100 = $3,600/contract will still be rejected by the tighter
# $1,500 budget; that's fine, LEAPS are inherently big-position bets that
# don't fit the "many small trades" pattern. Credit spreads + debit spreads
# should fire much more frequently.
composite_threshold: 30
position_cap: 30
position_size_pct: 8.0
stop_loss_pct: 100.0
take_profit_pct: 50.0
hold_max_days: 45
risk_overlay:
  daily_loss_limit_pct: 2.5
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 12
  pdt_enforce: false
regime_filters:
  - require: trend_regime != 'bear'
  - halt_if: vix_regime == 'panic'
execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 2
  fallback_to_market: false
  use_brackets: true
paper_only: true
notes: "PDT eliminated FINRA Notice 26-10 June 4 2026. Requires Alpaca Level 2 options approval."
discord:
  channel: options-signals

risk:
  deployment_target_pct: 0.40    # options have leverage — keep deployed % lower
  target_position_count: 6       # → ~$6,667/trade at $100k
  max_position_pct: 0.07
  max_total_deployed_pct: 0.65

# 2026-07-01: max_concurrent_positions removed — same rationale as
# options_income. position_cap (15) is the concurrency governor now.
