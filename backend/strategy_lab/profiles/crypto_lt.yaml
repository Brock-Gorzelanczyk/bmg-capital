name: crypto_lt
asset_class: crypto
broker: alpaca_paper_crypto
universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, LINK/USD]
  target_weights:
    BTC/USD: 0.40
    ETH/USD: 0.30
    SOL/USD: 0.15
    AVAX/USD: 0.10
    LINK/USD: 0.05
cadence: "0 10 * * 1"
cadence_dca: "0 10 * * 1"
cadence_rebalance: "0 10 1-7 * 2"
strategies:
  - dca_btc_eth
  - monthly_rebalance_majors
  - btc_dominance_rotation
  - dollar_cost_average_dip
  - yield_overlay
# yield_overlay pre-dates Phase 1's discipline filter and doesn't emit
# the factor fields (volume_agreement / mtf_alignment / cross_asset_agree)
# so its composite score lands ~53 vs the 60-default. Scoped override —
# the other 4 strategies score fine at 60 and stay at the bot default.
strategy_thresholds:
  yield_overlay: 50
cooldown_minutes: 240
position_cap: 8
position_size_pct: 20.0
rebalance_only: true
risk_overlay:
  portfolio_drawdown_circuit_pct: 25
regime_filters: []
execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 60
  fallback_to_market: true
  use_brackets: false
paper_only: true
discord:
  channel: crypto-signals

risk:
  deployment_target_pct: 0.70    # target: deploy 70% of bot capital → ~$11,667/trade at $100k
  target_position_count: 6
  max_position_pct: 0.12
  max_total_deployed_pct: 0.85

# 7-day deployment push (Brock 2026-06-24): bump sizing for active newer bots.
position_size_pct_override: 15
