universe:
  source: static
  size: 1
  symbols:
    - SPY
scan_lookback_period: "60d"
confidence_threshold: 0.40
cadence: "0 15 * * 1"    # Monday 15:00 UTC (10:00 ET) — weekly entry
long_only: false
strategies:
  - iron_condor_45dte
ensemble: any_above_threshold
composite_threshold: 20
position_cap: 8
position_size_pct: 12.0
hold_min_days: 7
