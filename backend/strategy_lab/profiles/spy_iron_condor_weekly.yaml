execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 60
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: false
paper_only: true
discord:
  channel: options-signals

risk:
  deployment_target_pct: 0.75
  target_position_count: 5
  max_position_pct: 0.15
  max_total_deployed_pct: 0.85
