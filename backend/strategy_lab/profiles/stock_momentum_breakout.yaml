name: stock_momentum_breakout
asset_class: stock
broker: alpaca_paper_stocks
# 2026-07-02 Brock table: 20-day-high momentum breakout swing trader, $20k.
# m057 approved + executed; bot now enabled for market open 2026-07-03.
enabled: true

universe:
  source: russell_1000_top_100_volume
  symbols:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
    - AMD
    - AVGO
    - NFLX
    - SMCI
    - PLTR
    - CRWD
    - PANW
    - MU
    - ANET
    - LLY
    - JPM
    - GS
    - COST
    - ORCL
    - CRM
    - ADBE
    - COIN
    - MSTR
    - HOOD
  filters:
    - price_gte: 25
    - adv_gte: 3000000
scan_lookback_period: "6mo"
scan_timeframe: "1d"
cadence: "30 15 * * 1-5"                # 3:30 PM ET Mon-Fri, right before close
watchlist:
  rebuild_at: "0 15 * * 1-5"
  size: 24
  top_n_for_signals: 18

strategies:
  - momentum_breakout
  - bull_flag_continuation
  - darvas_box_breakout
  - fifty_two_week_high_momentum

ensemble: any_above_threshold
confidence_threshold: 0.55

position_cap: 6
position_size_pct: 3.0
stop_loss_pct: 5.0                     # close < 10-day low proxy
take_profit_pct: 15.0                  # 3R
trailing_stop_activate_at_pct: 5.0
trailing_stop_distance_pct: 2.5
hold_max_days: 15                      # 5-15 day hold per spec

cooldown_minutes: 1440                 # 24h — one entry per name per day

risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 15.0
  max_gross_exposure_pct: 70.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 5.0
  pdt_enforce: false

execution:
  order_type: market
  limit_offset_bps: 5
  reprice_after_seconds: 45
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true

paper_only: true
starting_capital_cents: 2000000        # $20k

risk:
  deployment_target_pct: 0.70
  target_position_count: 5
  max_position_pct: 0.18
  max_total_deployed_pct: 0.80

discord:
  channel: stocks-signals

skip_execution_guards: true
