name: crypto_dca_btc_eth
asset_class: crypto
broker: alpaca_paper_crypto

# Long-only weekly DCA into BTC + ETH. No strategy alpha claimed — this is
# the "boring baseline" bot that always buys, uses no signals, uses no
# discipline gate. Its job is to guarantee the fund has BTC/ETH exposure
# no matter what the other bots do, and to give us a clean benchmark
# (dumb DCA return) to measure the smart bots against.
universe:
  symbols: [BTC/USD, ETH/USD]

scan_timeframe: "1d"
scan_lookback_bars: 30
# Weekly cadence — Monday 10:00 AM UTC. Same slot as crypto_lt.
cadence: "0 10 * * *"  # daily at 10 UTC (was weekly)

strategies:
  - crypto_dca_weekly

ensemble: any_above_threshold
confidence_threshold: 0.30   # DCA always fires — low threshold

position_cap: 10             # can accumulate up to 10 concurrent buys
position_size_pct: 4.0       # 4% × $30k = $1,200/buy
stop_loss_pct: 30.0          # very wide — DCA doesn't stop out on drawdown
take_profit_pct: 100.0       # 2x take-profit — long horizon
hold_max_days: 180

cooldown_minutes: 4320       # 3 days between BTC buys, ditto ETH

risk_overlay:
  daily_loss_limit_pct: 10.0
  portfolio_drawdown_circuit_pct: 40.0   # DCA holds through drawdowns
  pdt_enforce: false

execution:
  order_type: market
  limit_offset_bps: 20
  reprice_after_seconds: 60
  reprice_attempts: 2
  fallback_to_market: true
  use_brackets: false        # DCA is not bracket-managed

discord:
  channel: crypto-signals

paper_only: true
starting_capital_cents: 3000000   # $30k — funded from halted crypto_quant_scalper

risk:
  deployment_target_pct: 0.90    # deploy 90% — DCA is a stayed-invested bot
  target_position_count: 10
  max_position_pct: 0.15
  max_total_deployed_pct: 0.95

skip_execution_guards: true
