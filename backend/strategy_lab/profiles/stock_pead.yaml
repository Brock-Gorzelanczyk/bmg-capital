name: stock_pead
asset_class: stock
broker: alpaca_paper_stocks
# 2026-07-02 Brock table: Post-Earnings Announcement Drift, $20k.
# Enters on T+1 open after an earnings beat > 5%; 30-45 day hold.
# m057 approved + executed; bot now enabled for market open 2026-07-03.
enabled: true

universe:
  source: sp500_earnings_leaders
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
    - AMD
    - AVGO
    - NFLX
    - SMCI
    - PLTR
    - CRWD
    - PANW
    - LLY
    - JPM
    - GS
    - COST
    - WMT
    - HD
    - MCD
    - JNJ
    - PFE
    - MRK
    - XOM
    - CVX
    - CAT
    - GE
    - BA
    - COIN
  filters:
    - price_gte: 20
    - adv_gte: 2000000
scan_lookback_period: "1y"
scan_timeframe: "1d"
cadence: "0 16 * * 1-5"                # 4 PM ET Mon-Fri, right after close
watchlist:
  rebuild_at: "0 15 * * 1-5"
  size: 30
  top_n_for_signals: 20

strategies:
  - earnings_drift_post
  - pead_earnings_drift

ensemble: any_above_threshold
confidence_threshold: 0.55

position_cap: 12                       # 2026-07-02 Brock: more earnings-drift positions ($40k allocation)
position_size_pct: 5.0
stop_loss_pct: 8.0                     # close < entry - 8% per spec
take_profit_pct: 25.0
trailing_stop_activate_at_pct: 8.0
trailing_stop_distance_pct: 4.0
hold_max_days: 45                      # 30-45 day drift capture

cooldown_minutes: 4320                 # 3 days between entries on same name

risk_overlay:
  daily_loss_limit_pct: 2.5
  max_position_size_pct: 18.0
  max_gross_exposure_pct: 75.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 5.0
  pdt_enforce: false

execution:
  order_type: market
  limit_offset_bps: 5
  reprice_after_seconds: 60
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true

paper_only: true
starting_capital_cents: 2000000        # $20k

risk:
  deployment_target_pct: 0.80
  target_position_count: 6
  max_position_pct: 0.20
  max_total_deployed_pct: 0.90

discord:
  channel: stocks-signals

skip_execution_guards: true
