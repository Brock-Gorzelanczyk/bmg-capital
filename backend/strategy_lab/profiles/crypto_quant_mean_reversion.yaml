name: crypto_quant_mean_reversion
display_name: "Crypto Quant Mean Reversion"
asset_class: quant
broker: alpaca_paper_crypto

universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, POL/USD,
            LINK/USD, DOT/USD, ADA/USD, NEAR/USD, ATOM/USD]

scan_timeframe: "5m"
scan_lookback_bars: 288
cadence: "*/3 * * * *"

strategies:
  - crypto_mr_bollinger_extreme
  - crypto_mr_rsi_oversold_bounce
  - crypto_mr_rsi_overbought_short
  - crypto_mr_zscore_reversion
  - crypto_mr_keltner_outside_band
  - crypto_mr_pin_bar_rejection

ensemble: any_above_threshold
confidence_threshold: 0.50

cooldown_minutes: 60
hold_max_hours: 4

position_size_pct: 2.0
position_cap: 8
stop_loss_pct: 2.0
take_profit_pct: 2.5

risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 20.0
  max_gross_exposure_pct: 50.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_hours: 4
  consecutive_loss_halt_at: 6
  portfolio_drawdown_circuit_pct: 5.0
  pdt_enforce: false
  weekend_confidence_boost: 0.04

execution:
  order_type: market
  limit_offset_bps: 8
  reprice_after_seconds: 20
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true

discord:
  channel: quant-signals

paper_only: true
starting_capital_cents: 3000000   # $30k

risk:
  deployment_target_pct: 0.60    # target: deploy 60% of bot capital ($18k)
  target_position_count: 8       # spread across 8 positions → ~$2,250/trade
  max_position_pct: 0.12         # hard cap: no single position > 12% ($3,600)
  max_total_deployed_pct: 0.75   # hard cap: never exceed 75% deployed ($22.5k)

# Bypass anomaly/news/bot_coordinator execution guards so scheduled scans execute.
skip_execution_guards: true

# 7-day deployment push (Brock 2026-06-24): looser discipline for proven bots.
# Scale 0-100; default 60. Lower = more signals pass.
composite_threshold_override: 50
