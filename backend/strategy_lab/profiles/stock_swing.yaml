name: stock_swing
asset_class: equities
broker: alpaca_paper_stocks
universe:
  source: russell_1000
  symbols:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - TSLA
    - AMD
    - NFLX
    - JPM
    - BAC
    - XOM
    - CVX
    - GLD
    - TLT
    - GS
    - SMCI
    - AVGO
    - CRM
    - ORCL
    - SHOP
    - PLTR
    - COIN
    - MSTR
    - ARM
    - SOFI
    - HOOD
  filters:
    - price_gte: 5
    - adv_gte: 10000000
scan_lookback_period: "1y"
confidence_threshold: 0.45
cadence: "5 16 * * 1-5"
watchlist:
  rebuild_at: "5 16 * * 1-5"
  size: 100
  top_n_for_signals: 30
  scoring:
    momentum_20d: 0.3
    relative_strength: 0.3
    volume_trend: 0.2
    near_52w_high: 0.2
strategies:
  # v1 ported (preserved — no regression per acceptance criterion #9)
  - mean_reversion
  - momentum_breakout
  - rsi_bands
  # v2 swing roster (10-strategy total per spec)
  - fifty_two_week_high_momentum
  - relative_strength_leaders
  - factor_momentum_value
  - golden_cross
  - bollinger_squeeze
  - cup_and_handle
  - macd_crossover
  - earnings_drift_post
ensemble: weighted_vote
position_cap: 8
position_size_pct: 12.5
stop_loss_pct: 8.0
take_profit_pct: 18.0
trailing_stop_activate_at_pct: 10.0
hold_min_days: 1
hold_max_days: 30
risk_overlay:
  daily_loss_limit_pct: 3.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  per_trade_risk_pct: 1.0
  max_sector_concentration_pct: 30
  portfolio_drawdown_circuit_pct: 10
regime_filters:
  - halve_size_if: vix_regime == 'high'
  - halt_if: vix_regime == 'panic'
catalyst_gates:
  - blackout_minutes_around: [FOMC, CPI, NFP, PCE]
    minutes_before: 5
    minutes_after: 5
execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true
paper_only: true
risk_management:
  stop_loss_pct: 7
  trailing_stop_ratchet_pct: 10
  trailing_stop_min_pct: 7
  take_profit_pct: 25
  sector_concentration_max: 1
  exclude_pending_earnings_days: 3
  drawdown_circuit_breaker_pct: 30
regime_overrides:
  vix_high_position_size_multiplier: 0.5
  vix_extreme_halt_new_entries: true
discord:
  channel: stocks-signals

risk:
  deployment_target_pct: 0.50    # target: deploy 50% of bot capital → ~$6,250/trade at $100k
  target_position_count: 8
  max_position_pct: 0.10
  max_total_deployed_pct: 0.80
