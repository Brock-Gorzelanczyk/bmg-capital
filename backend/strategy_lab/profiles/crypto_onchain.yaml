name: crypto_onchain
asset_class: crypto
broker: alpaca_paper_crypto
universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, LINK/USD]
cadence: "30 */4 * * *"
# 2026-07-12: original on-chain strategies (mvrv_zscore, sopr, exchange_outflow,
# funding_rate_contrarian, liquidation_cascade, social_sentiment) all require
# paid data feeds (Glassnode / Coinglass / LunarCrush). GLASSNODE_API_KEY was
# never provisioned on Railway → get_latest_metric() returned None on every
# scan → 6 strategies produced 0 signals for 30+ days. Swapped for free-OHLC-
# only siblings so the $486.70 allocation actually trades. Restore the
# on-chain variants when the data feed lands.
strategies:
  - crypto_ema_cross
  - crypto_macd_swing
  - crypto_momentum_breakout
  - crypto_mr_zscore_reversion
ensemble: weighted_vote
cooldown_minutes: 240
position_cap: 3
position_size_pct: 10.0
stop_loss_pct: 20.0
take_profit_pct: 40.0
hold_max_days: 60
risk_overlay:
  daily_loss_limit_pct: 5.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 20
regime_filters: []
execution:
  order_type: limit
  limit_offset_bps: 10
  reprice_after_seconds: 60
  fallback_to_market: true
  use_brackets: false  # 2026-07-02 Alpaca crypto rejects otoco order_class — rely on internal stop/target monitor
paper_only: true
discord:
  channel: crypto-signals

risk:
  deployment_target_pct: 0.40    # target: deploy 40% of bot capital → ~$4,000/trade at $100k
  target_position_count: 10
  max_position_pct: 0.06
  max_total_deployed_pct: 0.70

# 7-day deployment push (Brock 2026-06-24): looser discipline for proven bots.
# Scale 0-100; default 60. Lower = more signals pass.
composite_threshold_override: 50

# 7-day deployment push (Brock 2026-06-24): bump sizing for proven bots.
position_size_pct_override: 25

