name: stock_day
asset_class: equities
broker: alpaca_paper_stocks
universe:
  source: russell_1000
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - META
    - AMZN
    - MSFT
    - GOOGL
    - NFLX
    - SMCI
    - ARM
    - MSTR
    - SOFI
    - PLTR
    - COIN
    - HOOD
    - MARA
    - RIVN
  filters:
    - price_gte: 10
    - adv_gte: 50000000
    - no_earnings_within_days: 5
    - no_halt_within_days: 5
scan_lookback_period: "1y"
confidence_threshold: 0.45
cadence: "*/5 4-19 * * 1-5"
long_only: true
watchlist:
  rebuild_at: "30 8 * * 1-5"
  size: 50
  scoring:
    overnight_gap_pct: 0.3
    premarket_vol_ratio: 0.3
    earnings_calendar_hit: 0.2
    news_catalyst_score: 0.2
strategies:
  - orb_stocks_in_play
  - intraday_momentum_noise_band
  - heston_half_hour_continuation
  - first_half_hour_predicts_last
  - pead_intraday_drift
  - gex_pin_reversion
  - fomc_drift
  - vwap_reversion_chop
ensemble: weighted_vote
position_cap: 3
position_size_pct: 5
stop_loss_pct: 1.5
take_profit_pct: 2.5
trailing_stop_activate_at_pct: 0.8
hold_max_hours: 6.5
risk_overlay:
  daily_loss_limit_pct: 2.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  per_trade_risk_pct: 1.0
  pdt_enforce: false  # PDT minimum eliminated by FINRA Notice 26-10, effective June 4 2026
  max_sector_concentration_pct: 30
  portfolio_drawdown_circuit_pct: 10
  extended_hours_size_multiplier: 0.5
  extended_hours_confidence_boost: 0.10
  min_spread_bps_extended: 25
regime_filters:
  - require: trend_regime != 'bear'
  - halve_size_if: vix_regime == 'high'
  - halt_if: vix_regime == 'panic'
catalyst_gates:
  - blackout_minutes_around: [FOMC, CPI, NFP, PCE]
    minutes_before: 5
    minutes_after: 5
session_filter:
  extended_ok_strategies:
    - earnings_gap_continuation
    - pead_intraday_drift
    - gap_and_go_momentum
    - orb_stocks_in_play
    - intraday_momentum_noise_band

execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: true
  extended_hours: true
paper_only: true
risk_management:
  stop_loss_pct: 7
  trailing_stop_ratchet_pct: 10
  trailing_stop_min_pct: 7
  take_profit_pct: 25
  sector_concentration_max: 1
  exclude_pending_earnings_days: 3
  drawdown_circuit_breaker_pct: 30
regime_overrides:
  vix_high_position_size_multiplier: 0.5
  vix_extreme_halt_new_entries: true
discord:
  channel: stocks-signals

risk:
  deployment_target_pct: 0.60    # target: deploy 60% of bot capital → ~$6,000/trade at $100k
  target_position_count: 10
  max_position_pct: 0.08
  max_total_deployed_pct: 0.80
