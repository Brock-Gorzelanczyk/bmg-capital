name: options_income
asset_class: options
broker: alpaca_paper_stocks
universe:
  source: sp500_high_iv_rank
  symbols:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - GOOGL
    - NVDA
    - AMZN
    - JPM
    - XOM
    - GLD
    - TLT
    - SMCI
    - AVGO
    - GS
  filters:
    - price_gte: 20
    - adv_gte: 1000000
    - iv_rank_gte: 30
scan_lookback_period: "1y"
cadence: "0,30 10-15 * * 1-5"
watchlist:
  rebuild_at: "0 9 * * 1-5"
  size: 20
  top_n_for_signals: 10
  scoring:
    iv_rank: 0.4
    trend_neutral: 0.3
    liquidity: 0.3
strategies:
  - wheel_strategy
  - covered_call_30d
  - cash_secured_put
  - pmcc_diagonal
  - iron_condor_45dte
  - jade_lizard
  - neutral_calendar_spread
ensemble: weighted_vote
# Options strategies pre-date Phase 1's discipline filter and don't yet
# emit volume_agreement / mtf_alignment / cross_asset_agree in their reason
# JSON. With those at default 0.5, signals score ~57 and get filtered by
# the default 60-point score gate.
#
# 2026-06-30: Lowered from 50 → 45 because /api/admin/inert-bot-scan still
# showed 169 signals blocked by confidence in last 24h at the 50 threshold.
# Paired with PR #42 (OCC symbol fix) so passing signals can now actually
# become real options trades. Daily audit will alert if signal volume floods
# the sleeve. Re-tune upward (or upgrade strategies to emit factor fields)
# once we have trade-history Sharpe to evaluate.
# 2026-07-01 (Brock override): more aggressive, less cash per position.
# Lowered composite_threshold 45 → 30 to unblock more signals (169 were
# filtered on 2026-06-30 alone). Position size 20% → 8% so each trade is
# smaller. position_cap 5 → 15 so we can hold many small positions in
# parallel. Combined with OPTIONS_MAX_NOTIONAL_PCT 5% → 3% in runner.py,
# per-trade budget lands at min($4k, $1.5k) = $1.5k on a $50k sleeve.
# Worst-case: 15 positions × $1.5k = $22.5k risk (45% of sleeve).
composite_threshold: 30
position_cap: 15
position_size_pct: 8.0
stop_loss_pct: 50.0
take_profit_pct: 50.0
hold_max_days: 45
risk_overlay:
  daily_loss_limit_pct: 3.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 15
  pdt_enforce: false
regime_filters:
  - halt_if: vix_regime == 'panic'
  - halve_size_if: vix_regime == 'high'
execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: true
paper_only: true
notes: "Requires Alpaca Level 2-3 options approval. PDT eliminated FINRA Notice 26-10 June 4 2026."
discord:
  channel: options-signals

risk:
  deployment_target_pct: 0.50    # target: deploy 50% of bot capital → ~$6,250/trade at $100k
  target_position_count: 8
  max_position_pct: 0.07
  max_total_deployed_pct: 0.70

# 2026-07-01: max_concurrent_positions removed. The 2026-06-24 push forced
# concentration (4 positions) which is the OPPOSITE of what we want now.
# position_cap (15) governs concurrency; more, smaller positions per Brock's
# "more aggressive + less cash per position" directive.
