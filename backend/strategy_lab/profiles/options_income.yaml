name: options_income
asset_class: options
broker: alpaca_paper_stocks
universe:
  source: sp500_high_iv_rank
  filters:
    - price_gte: 20
    - adv_gte: 1000000
    - iv_rank_gte: 30
cadence: "0 10 * * 1-5"
watchlist:
  rebuild_at: "0 9 * * 1-5"
  size: 20
  top_n_for_signals: 10
  scoring:
    iv_rank: 0.4
    trend_neutral: 0.3
    liquidity: 0.3
strategies:
  - wheel_strategy
  - covered_call_30d
  - cash_secured_put
  - pmcc_diagonal
  - iron_condor_45dte
  - jade_lizard
  - neutral_calendar_spread
ensemble: weighted_vote
position_cap: 5
position_size_pct: 20.0
stop_loss_pct: 50.0
take_profit_pct: 50.0
hold_max_days: 45
risk_overlay:
  daily_loss_limit_pct: 3.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 15
  pdt_enforce: false
regime_filters:
  - halt_if: vix_regime == 'panic'
  - halve_size_if: vix_regime == 'high'
execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: true
paper_only: true
notes: "Requires Alpaca Level 2-3 options approval. PDT eliminated FINRA Notice 26-10 June 4 2026."
