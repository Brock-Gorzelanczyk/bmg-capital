name: options_wheel_mechanical
enabled: false
asset_class: options
broker: alpaca_paper_stocks
paper_only: true
candidate_stage: enabled_false

universe:
  source: dividend_payer_universe
  symbols:
    - AAPL
    - MSFT
    - JPM
    - JNJ
    - KO
    - PEP
    - VZ
    - T
    - XOM
    - CVX
    - SPY
    - QQQ
    - GLD
    - IWM
  filters:
    - price_gte: 20
    - mcap_gte: 20000000000
    - adv_gte: 5000000

scan_lookback_period: "1y"
cadence: "0 10 * * 1-5"

watchlist:
  rebuild_at: "30 9 * * 1-5"
  size: 5
  top_n_for_signals: 3
  scoring:
    ivr_proxy: 0.35
    stability: 0.35
    dividend_quality: 0.30

strategies:
  - options_wheel_mechanical
ensemble: single_strategy

position_cap: 3
position_size_pct: 3.0
stop_loss_pct: 200.0
take_profit_pct: 50.0
hold_max_days: 45

risk_overlay:
  daily_loss_limit_pct: 3.0
  consecutive_loss_halve_at: 2
  consecutive_loss_halt_at: 4
  portfolio_drawdown_circuit_pct: 20
  hard_stop_on_stock_pct: -20.0    # close assigned stock if -20%
  pdt_enforce: false

regime_filters:
  - halt_if: vix_regime == 'panic'
  - halt_if: playbook_regime == 'CRISIS'

execution:
  order_type: limit
  limit_offset_bps: 10
  reprice_after_seconds: 45
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: false

discord:
  channel: options-signals

risk:
  deployment_target_pct: 0.09    # 3 positions × 3%
  target_position_count: 3
  max_position_pct: 0.05
  max_total_deployed_pct: 0.20

notes: >
  Wave 1 options candidate. enabled: false until pipeline complete.
  State machine: SCANNING → CSP → (50% close | assignment) → CC → repeat.
  Hard stop: -20% on assigned stock leg.
  Requires Alpaca options data + stock trading for assignment handling.
  Most complex of Wave 1 — requires execution layer state machine support.
