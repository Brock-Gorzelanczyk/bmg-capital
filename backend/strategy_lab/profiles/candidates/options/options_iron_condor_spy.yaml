name: options_iron_condor_spy
enabled: false
asset_class: options
broker: alpaca_paper_stocks
paper_only: true
candidate_stage: enabled_false

universe:
  source: single_symbol
  symbols:
    - SPY
  filters:
    - price_gte: 100
    - adv_gte: 50000000

scan_lookback_period: "1y"
cadence: "0 10 * * 1-5"

watchlist:
  rebuild_at: "30 9 * * 1-5"
  size: 1
  top_n_for_signals: 1
  scoring:
    ivr_proxy: 0.40
    atr_contracting: 0.40
    liquidity: 0.20

strategies:
  - options_iron_condor_spy
ensemble: single_strategy

position_cap: 1
position_size_pct: 2.0
stop_loss_pct: 300.0    # max IC loss = ~3x credit on width
take_profit_pct: 50.0
hold_max_days: 45

risk_overlay:
  daily_loss_limit_pct: 2.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 12
  pdt_enforce: false

regime_filters:
  - halt_if: vix_regime == 'panic'
  - halt_if: playbook_regime == 'CRISIS'
  - halve_size_if: vix_regime == 'high'

execution:
  order_type: limit
  limit_offset_bps: 5
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: false
  use_brackets: false

discord:
  channel: options-signals

risk:
  deployment_target_pct: 0.02
  target_position_count: 1
  max_position_pct: 0.02
  max_total_deployed_pct: 0.10

notes: >
  Wave 1 options candidate. enabled: false until pipeline complete.
  SPY-only. Entry: IVR proxy > 30 AND 5-day ATR contracting.
  Exit: 50% credit | 21 DTE | short strike breach.
  Wings 10 points wide. Requires Alpaca options data subscription.
