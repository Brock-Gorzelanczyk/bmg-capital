name: crypto_swing
asset_class: crypto
broker: alpaca_paper_crypto
universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, MATIC/USD, LINK/USD, DOT/USD, ADA/USD, ATOM/USD, DOGE/USD,
            ARB/USD, OP/USD, INJ/USD, FET/USD, TIA/USD, SEI/USD, JUP/USD, ONDO/USD, WIF/USD, BONK/USD]
cadence: "0 */4 * * *"
watchlist:
  rebuild_at: "0 0 * * *"
  size: 30
  top_n_for_signals: 12
  scoring:
    momentum_7d: 0.35
    rsi_position: 0.25
    volume_trend: 0.2
    btc_relative_strength: 0.2
strategies:
  - crypto_rsi_mean_reversion
  - crypto_momentum_breakout
  - crypto_ema_cross
  - crypto_macd_swing
  - crypto_relative_strength
ensemble: weighted_vote
confidence_threshold: 0.55
position_cap: 6
position_size_pct: 4.0
stop_loss_pct: 8.0
take_profit_pct: 18.0
trailing_stop_activate_at_pct: 10.0
trailing_stop_distance_pct: 3.0
hold_min_days: 1
hold_max_days: 30
risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 6.0
  max_gross_exposure_pct: 80.0
  consecutive_loss_halve_at: 5
  consecutive_loss_halt_at: 10
  portfolio_drawdown_circuit_pct: 10.0
execution:
  order_type: market
  limit_offset_bps: 10
  reprice_after_seconds: 60
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true
paper_only: true
discord:
  channel: crypto-signals
