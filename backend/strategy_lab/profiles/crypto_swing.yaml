name: crypto_swing
asset_class: crypto
broker: alpaca_paper_crypto
universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, MATIC/USD, LINK/USD, DOT/USD, ADA/USD, ATOM/USD, FTM/USD]
cadence: "0 */4 * * *"
watchlist:
  rebuild_at: "0 0 * * *"
  size: 30
  top_n_for_signals: 10
  scoring:
    momentum_7d: 0.35
    rsi_position: 0.25
    volume_trend: 0.2
    btc_relative_strength: 0.2
strategies:
  - crypto_rsi_mean_reversion
  - crypto_momentum_breakout
  - crypto_btc_dominance_regime
ensemble: weighted_vote
position_cap: 5
position_size_pct: 20.0
stop_loss_pct: 15.0
take_profit_pct: 30.0
trailing_stop_activate_at_pct: 20.0
hold_min_days: 1
hold_max_days: 30
risk_overlay:
  daily_loss_limit_pct: 5.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_at: 5
  portfolio_drawdown_circuit_pct: 15
regime_filters:
  - halt_if: btc_funding_rate > 0.002
execution:
  order_type: limit
  limit_offset_bps: 10
  reprice_after_seconds: 60
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true
paper_only: true
