name: crypto_quant_scalper
display_name: "Crypto Quant Scalper"
asset_class: quant
broker: alpaca_paper_crypto

universe:
  symbols: [BTC/USD, ETH/USD, SOL/USD, BNB/USD, XRP/USD, AVAX/USD]

scan_timeframe: "1m"
scan_lookback_bars: 120
cadence: "*/1 * * * *"

strategies:
  - crypto_scalper_micro_breakout
  - crypto_scalper_orderbook_imbalance
  - crypto_scalper_tape_acceleration
  - crypto_scalper_vwap_band_reject
  - crypto_scalper_volume_spike_continuation

ensemble: any_above_threshold
confidence_threshold: 0.42

cooldown_minutes: 15
hold_max_minutes: 30

position_size_pct: 1.5
position_cap: 12
stop_loss_pct: 0.5
take_profit_pct: 1.0
trailing_stop_activate_at_pct: 0.6

risk_overlay:
  daily_loss_limit_pct: 2.0
  max_position_size_pct: 10.0
  max_gross_exposure_pct: 40.0
  consecutive_loss_halve_at: 5
  consecutive_loss_halt_hours: 2
  consecutive_loss_halt_at: 10
  portfolio_drawdown_circuit_pct: 3.0
  pdt_enforce: false
  weekend_confidence_boost: 0.03

execution:
  order_type: market
  limit_offset_bps: 5
  reprice_after_seconds: 10
  reprice_attempts: 2
  fallback_to_market: true
  use_brackets: true

discord:
  channel: quant-signals

paper_only: true
starting_capital_cents: 3000000   # $30k

risk:
  deployment_target_pct: 0.70    # target: deploy 70% of bot capital ($21k)
  target_position_count: 10      # spread across 10 positions → ~$2,100/trade
  max_position_pct: 0.10         # hard cap: no single position > 10% ($3,000)
  max_total_deployed_pct: 0.80   # hard cap: never exceed 80% deployed ($24k)

# Bypass anomaly/news/bot_coordinator execution guards so scheduled scans execute.
skip_execution_guards: true

# 7-day deployment push (Brock 2026-06-24): bump sizing for active newer bots.
position_size_pct_override: 15
