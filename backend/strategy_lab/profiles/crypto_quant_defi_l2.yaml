name: crypto_quant_defi_l2
asset_class: quant
broker: alpaca_paper_crypto

# DeFi / L2 basket. These names correlate less with BTC and often move on
# their own news + protocol flow. Full 8-strategy stack — the diversification
# benefit comes from the UNIVERSE, not from a narrower alpha family.
universe:
  symbols: [ARB/USD, ARB/USD, UNI/USD, AAVE/USD, LTC/USD, LINK/USD, GRT/USD, DOT/USD]

scan_timeframe: "5m"
scan_lookback_bars: 200
cadence: "*/5 * * * *"

watchlist:
  rebuild_at: "0 */4 * * *"
  size: 8
  top_n_for_signals: 6

strategies:
  - crypto_quant_vwap_fade
  - crypto_quant_bb_breakout
  - crypto_quant_momentum_trigger
  - crypto_quant_volume_zscore_spike
  - crypto_quant_range_break_retest
  - crypto_quant_orderflow_imbalance
  - crypto_quant_funding_rate_arb
  - crypto_quant_donchian_breakout_5m

ensemble: any_above_threshold
confidence_threshold: 0.45

anti_overfit_multi_signal_conf: 0.65
anti_correlation_top_n: 3

size_bands:
  - min: 0.45
    max: 0.55
    multiplier: 0.4
  - min: 0.55
    max: 0.65
    multiplier: 0.7
  - min: 0.65
    max: 0.75
    multiplier: 1.0
  - min: 0.75
    max: 1.0
    multiplier: 1.3

position_cap: 15                # 2026-07-02 Brock: spread the +$10k across more names
position_size_pct: 2.5         # 2026-07-02 Brock: modest bump 2.0 → 2.5
stop_loss_pct: 2.0
take_profit_pct: 4.0
trailing_stop_activate_at_pct: 2.0
trailing_stop_distance_pct: 1.0
hold_max_hours: 8

cooldown_minutes: 30

risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 15.0
  max_gross_exposure_pct: 55.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_hours: 4
  consecutive_loss_halt_at: 6
  portfolio_drawdown_circuit_pct: 4.5
  pdt_enforce: false

execution:
  order_type: market
  limit_offset_bps: 15
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: false  # 2026-07-02 Alpaca crypto rejects otoco order_class — rely on internal stop/target monitor

discord:
  channel: quant-signals

paper_only: true
starting_capital_cents: 2000000   # $20k

risk:
  deployment_target_pct: 0.65
  target_position_count: 6
  max_position_pct: 0.15
  max_total_deployed_pct: 0.75

skip_execution_guards: true
