name: crypto_day
asset_class: crypto
broker: alpaca_paper_crypto
universe:
  # 2026-07-07 dropped OP/USD (not on Alpaca paper), added ARB/USD.
  symbols: [BTC/USD, ETH/USD, SOL/USD, DOGE/USD, ADA/USD, AVAX/USD, LINK/USD, AAVE/USD, UNI/USD, ARB/USD]
scan_timeframe: "1h"
scan_lookback_bars: 500
cadence: "*/5 * * * *"
watchlist:
  rebuild_at: "0 */4 * * *"
  size: 10
  top_n_for_signals: 8
  scoring:
    intraday_momentum: 0.4
    volume_ratio: 0.3
    btc_correlation: 0.3
strategies:
  - crypto_intraday_momentum
  - crypto_volatility_breakout
  - crypto_session_open
  # 2026-07-03 Brock: broaden signal generation. Original 3 all
  # trend/session-followers → producing 0 signals for 24h+ when the
  # market lacks strong sessions or breakouts. Added 4 complementary
  # strategies covering mean-reversion, EMA cross, MACD swing, and
  # range-breakout to catch setups the original trio misses.
  - crypto_rsi_mean_reversion
  - crypto_ema_cross
  - crypto_macd_swing
  - crypto_quant_range_break_retest
ensemble: any_above_threshold
# TEMP: lowered 2026-06-07 to validate organic signal firing
# while pre-filters are loose. Restore to 0.45 after first
# organic signal lands in Discord.
confidence_threshold: 0.30
position_cap: 12                # 2026-07-02 Brock: more concurrent scalps ($80k allocation has headroom)
position_size_pct: 2.5         # 2026-07-02 Brock: bumped 1.5 → 2.5
stop_loss_pct: 1.0
take_profit_pct: 1.5
trailing_stop_activate_at_pct: 0.75
trailing_stop_distance_pct: 0.25
hold_max_hours: 8
cooldown_minutes: 30
risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 6.0
  max_gross_exposure_pct: 80.0
  consecutive_loss_halve_at: 5
  consecutive_loss_halt_at: 10
  portfolio_drawdown_circuit_pct: 5.0
  pdt_enforce: false
execution:
  order_type: market
  limit_offset_bps: 10
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: false  # 2026-07-02 Alpaca crypto rejects otoco order_class — rely on internal stop/target monitor
paper_only: true
discord:
  channel: crypto-signals

risk:
  deployment_target_pct: 0.60    # target: deploy 60% of bot capital → ~$5,000/trade at $100k
  target_position_count: 12
  max_position_pct: 0.07
  max_total_deployed_pct: 0.80

# 7-day deployment push (Brock 2026-06-24): bump sizing for active newer bots.
position_size_pct_override: 15


# 2026-07-13 fire-more push: default 60 composite gate was blocking signals.
# crypto_day was blocking 377 signals/day with default 60 composite gate. Relaxed to 30.
composite_threshold_override: 30
