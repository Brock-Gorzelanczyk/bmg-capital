name: crypto_quant_meme_tier
asset_class: quant
broker: alpaca_paper_crypto

# Meme + high-beta tier. DOGE, SHIB, PEPE, AVAX, POL. These names move on
# retail momentum with weak fundamentals — 8-strategy stack lets us catch
# both breakouts and mean-reversion when the pump exhausts. Small size
# to bound losses when the meme meta shifts.
universe:
  symbols: [DOGE/USD, SHIB/USD, PEPE/USD, AVAX/USD, POL/USD]

scan_timeframe: "5m"
scan_lookback_bars: 200
cadence: "*/5 * * * *"

watchlist:
  rebuild_at: "0 */4 * * *"
  size: 5
  top_n_for_signals: 5

strategies:
  - crypto_quant_vwap_fade
  - crypto_quant_bb_breakout
  - crypto_quant_momentum_trigger
  - crypto_quant_volume_zscore_spike
  - crypto_quant_range_break_retest
  - crypto_quant_orderflow_imbalance
  - crypto_quant_funding_rate_arb
  - crypto_quant_donchian_breakout_5m

ensemble: any_above_threshold
confidence_threshold: 0.50   # slightly stricter — meme volatility warrants it

anti_overfit_multi_signal_conf: 0.70
anti_correlation_top_n: 2

size_bands:
  - min: 0.50
    max: 0.60
    multiplier: 0.3
  - min: 0.60
    max: 0.70
    multiplier: 0.5
  - min: 0.70
    max: 0.85
    multiplier: 0.8
  - min: 0.85
    max: 1.0
    multiplier: 1.0

position_cap: 5
position_size_pct: 1.5     # small — memes can gap
stop_loss_pct: 3.0
take_profit_pct: 6.0
trailing_stop_activate_at_pct: 3.0
trailing_stop_distance_pct: 1.5
hold_max_hours: 8

cooldown_minutes: 60

risk_overlay:
  daily_loss_limit_pct: 3.0
  max_position_size_pct: 10.0
  max_gross_exposure_pct: 50.0
  consecutive_loss_halve_at: 3
  consecutive_loss_halt_hours: 4
  consecutive_loss_halt_at: 6
  portfolio_drawdown_circuit_pct: 5.0
  pdt_enforce: false

execution:
  order_type: market
  limit_offset_bps: 20     # meme spreads run wider
  reprice_after_seconds: 30
  reprice_attempts: 3
  fallback_to_market: true
  use_brackets: true

discord:
  channel: quant-signals

paper_only: true
starting_capital_cents: 2000000   # $20k

risk:
  deployment_target_pct: 0.60
  target_position_count: 4
  max_position_pct: 0.12
  max_total_deployed_pct: 0.70

skip_execution_guards: true
